# Ежедневное обновление данных агентства с ЦИАН и Домклик.
# Расписание в UTC: 21:00 UTC = 00:00 по Москве.
# Коммит с новыми data/*.json и фото попадает в main; если хостинг
# (Vercel/Netlify/VPS с автодеплоем) следит за веткой, сайт пересоберётся сам.
name: Sync listings

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # На ubuntu-latest предустановлен Google Chrome: playwright-core
      # запускает его через channel "chrome" без скачивания браузера.
      - name: Sync data from Cian and DomClick
        run: npm run sync

      - name: Commit updated data
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git add data public/listings public/team
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "data: ежедневное обновление объявлений ($(date -u +%Y-%m-%d))"
            git push
          fi
