# Apache 2.4: виртуальный хост positiv-vt.ru -> Node.js на 127.0.0.1:3000
# (для серверов, где сайты уже обслуживает Apache, в том числе под Windows).
# Нужны модули: mod_proxy, mod_proxy_http, mod_headers, mod_rewrite, mod_ssl.
#
# Сайт целиком отдаёт Node.js, включая адреса старого сайта
# /cgi-bin/positiv_vt/index.pl?... (на них Node отвечает 301 на нужный раздел).
# Поэтому в этом vhost НЕ должно быть ScriptAlias /cgi-bin/ и обработчиков
# Perl/CGI старого сайта: иначе старые адреса продолжит отдавать Perl.

<VirtualHost *:80>
    ServerName positiv-vt.ru
    ServerAlias www.positiv-vt.ru

    # после выпуска сертификата всё HTTP уводим на HTTPS;
    # путь /.well-known/ оставляем для проверки домена при выпуске
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^/(.*)$ https://positiv-vt.ru/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName positiv-vt.ru
    ServerAlias www.positiv-vt.ru

    SSLEngine on
    # пути к сертификату выставит win-acme / certbot (см. HANDOFF.md)
    SSLCertificateFile    "C:/certs/positiv-vt.ru-crt.pem"
    SSLCertificateKeyFile "C:/certs/positiv-vt.ru-key.pem"
    SSLCertificateChainFile "C:/certs/positiv-vt.ru-chain.pem"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # www -> без www, один адрес для поисковиков
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^/(.*)$ https://positiv-vt.ru/$1 [R=301,L]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # реальный IP посетителя: сайт пишет его в журнал согласий на обработку
    # персональных данных и ограничивает по нему частоту заявок
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    LimitRequestBody 2097152
</VirtualHost>
