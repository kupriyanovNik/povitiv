# nginx-конфиг: /etc/nginx/sites-available/positiv-vt
# После установки: certbot --nginx -d positiv-vt.ru -d www.positiv-vt.ru --redirect
# Certbot переводит оба server-блока на 443 и добавляет :80-блоки с редиректом
# HTTP->HTTPS (--redirect включает это явно). Проверка: HANDOFF раздел 8,
# «curl -sI http://... -> 301».
# Редирект намеренно не зашит в этот файл: certbot правит существующий блок
# на месте, и зашитый в location / return 301 превратился бы на HTTPS в петлю.
# Сертификат нужен и www: браузер получает редирект по защищённому соединению.
server {
    listen 80;
    server_name www.positiv-vt.ru;
    return 301 https://positiv-vt.ru$request_uri;
}

server {
    listen 80;
    server_name positiv-vt.ru;

    # базовые заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # статика Next.js: отдаёт nginx с длинным кэшем
    location /_next/static/ {
        alias /var/www/positiv-vt/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header внутри location отменяет заголовки уровня server:
        # повторяем заголовки безопасности и для статики
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
